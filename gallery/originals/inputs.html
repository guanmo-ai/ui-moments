<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>原创表单控件 · UI Moments</title>
  <meta name="description" content="UI Moments 原创表单控件：划线清单、石子评分、档位滑块、密码强度、标签输入与方案卡片。">
  <link rel="icon" href="../../assets/icon.svg">
  <script src="../../assets/embed.js"></script>
  <script>
    // 独立打开时跟随站点主题；嵌入画廊时由 embed.js 决定。
    (() => {
      const root = document.documentElement;
      if (root.dataset.embedded) return;
      let theme;
      try { theme = localStorage.getItem('ui-moments-theme'); } catch {}
      root.dataset.theme = theme || (matchMedia('(prefers-color-scheme: light)').matches ? 'light' : 'dark');
    })();
  </script>
  <style>
    @font-face { font-family: Geist; src: url('../../assets/fonts/Geist-latin-wght.woff2') format('woff2'); font-weight: 100 900; font-display: swap; }

    :root {
      color-scheme: light;
      --page: #f8f8fb;
      --surface: #f1f2f8;
      --raised: #fff;
      --ink: #20212a;
      --muted: #65697b;
      --rail: rgb(34 38 81 / .13);
      --line: rgb(34 38 81 / .12);
      --accent: #434eaa;
      --on-accent: #fff;
      --accent-soft: rgb(67 78 170 / .14);
      --danger: #c6402f;
      --danger-soft: rgb(198 64 47 / .14);
      --shadow: 0 1px 2px rgb(20 22 50 / .14), 0 6px 18px rgb(20 22 50 / .09);
      --spring: cubic-bezier(.3, 1.45, .5, 1);
      --ease: cubic-bezier(.16, 1, .3, 1);
      --font: Geist, -apple-system, BlinkMacSystemFont, "PingFang SC", "Microsoft YaHei", system-ui, sans-serif;
    }

    :root[data-theme="dark"] {
      color-scheme: dark;
      --page: #111217;
      --surface: #1c1e27;
      --raised: #2b2e3d;
      --ink: #f4f3f8;
      --muted: #a0a2b5;
      --rail: rgb(216 219 249 / .15);
      --line: rgb(216 219 249 / .12);
      --accent: #bcc4ff;
      --on-accent: #1c2142;
      --accent-soft: rgb(188 196 255 / .16);
      --danger: #ff8f80;
      --danger-soft: rgb(255 143 128 / .17);
      --shadow: 0 1px 2px rgb(0 0 0 / .45), 0 8px 24px rgb(0 0 0 / .3);
    }

    *, *::before, *::after { box-sizing: border-box; }
    [hidden] { display: none !important; }
    html { background: var(--page); }
    body { margin: 0; background: var(--page); color: var(--ink); font: 400 14px/1.6 var(--font); -webkit-font-smoothing: antialiased; }
    button, input, output { font: inherit; color: inherit; }
    button { cursor: pointer; -webkit-tap-highlight-color: transparent; }
    a { color: inherit; text-underline-offset: .25em; }
    :focus-visible { outline: 2px solid var(--accent); outline-offset: 4px; }
    .sr-only { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

    .page { max-width: 1040px; padding: 0 28px; margin-inline: auto; }
    .masthead { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding-top: 24px; font-size: 12px; color: var(--muted); }
    .masthead nav { display: flex; align-items: center; gap: 16px; }
    .brand { color: var(--ink); font-size: 13px; font-weight: 700; text-decoration: none; }
    .site-link { text-decoration: none; }
    .site-link:hover { color: var(--ink); }
    .theme { width: 32px; height: 32px; display: grid; place-items: center; border: 1px solid var(--line); border-radius: 9px; background: none; color: var(--muted); }
    .theme:hover { color: var(--ink); }
    .theme svg { width: 15px; height: 15px; }
    .intro { margin: clamp(48px, 10vh, 96px) 0 26px; }
    .intro p:first-child { margin: 0 0 8px; font: 500 11px/1.4 ui-monospace, monospace; letter-spacing: .12em; color: var(--accent); text-transform: uppercase; }
    h1 { margin: 0; font-size: clamp(30px, 6vw, 44px); letter-spacing: -.05em; line-height: 1.1; font-weight: 680; }
    .intro p:last-child { margin: 12px 0 0; max-width: 34em; color: var(--muted); }

    .samples { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 14px; }
    .sample { min-width: 0; }
    .stage {
      position: relative;
      display: grid;
      place-items: center;
      height: 220px;
      border-radius: 22px;
      background: var(--surface);
      container-type: size;
      overflow: hidden;
    }
    .caption { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; padding: 11px 4px 0; }
    .caption h2 { margin: 0; font-size: 14px; line-height: 1.4; font-weight: 650; }
    .caption p, .credit { margin: 0; font-size: 12px; color: var(--muted); }
    .credit { margin: 40px 0 28px; padding-top: 18px; border-top: 1px solid var(--line); }

    /* 卡片尺寸不同：控件按舞台大小缩放，指针坐标仍以实际尺寸计算。 */
    .widget { display: grid; place-items: center; transition: scale .3s var(--ease); }
    @container (max-height: 160px) { .widget { scale: .82; } }
    @container (max-width: 215px) { .widget { scale: .8; } }
    @container (max-height: 128px) { .widget { scale: .7; } }
    @container (max-width: 180px) { .widget { scale: .66; } }
    @container (min-height: 300px) and (min-width: 440px) { .widget { scale: 1.35; } }


    :root { --warn: #b86b12; --ok: #2c8655; --weak: #c6402f; }
    :root[data-theme="dark"] { --warn: #ffc27a; --ok: #7fe0a8; --weak: #ff8f80; }

    /* 划线清单 */
    .todo { display: grid; gap: 4px; width: 196px; margin: 0; padding: 0; border: 0; }
    .todo label { position: relative; display: flex; align-items: center; gap: 11px; padding: 7px 10px; border-radius: 10px; cursor: pointer; transition: background .2s; }
    .todo label:hover { background: var(--accent-soft); }
    .todo input { position: absolute; opacity: 0; pointer-events: none; }
    .todo .box { display: grid; place-items: center; flex: none; width: 20px; height: 20px; border: 1.6px solid var(--muted); border-radius: 6px; transition: background .25s, border-color .25s; }
    .todo .box svg { width: 14px; height: 14px; fill: none; stroke: var(--on-accent); stroke-width: 2.4; stroke-linecap: round; stroke-linejoin: round; stroke-dasharray: 18; stroke-dashoffset: 18; transition: stroke-dashoffset .3s var(--ease) .05s; }
    .todo .text { position: relative; font-size: 14px; transition: color .3s; }
    .todo .text::after { position: absolute; left: -2px; right: -2px; top: 52%; height: 1.6px; content: ''; border-radius: 2px; background: currentColor; transform: scaleX(0); transform-origin: left; transition: transform .38s var(--ease) .12s; }
    .todo input:checked + .box { background: var(--accent); border-color: var(--accent); animation: todo-pop .4s var(--spring); }
    .todo input:checked + .box svg { stroke-dashoffset: 0; }
    .todo input:checked ~ .text { color: var(--muted); }
    .todo input:checked ~ .text::after { transform: scaleX(1); }
    .todo input:focus-visible + .box { outline: 2px solid var(--accent); outline-offset: 3px; }
    @keyframes todo-pop { 0% { scale: .7; } 60% { scale: 1.15; } 100% { scale: 1; } }

    /* 石子评分 */
    .pebbles { display: grid; justify-items: center; gap: 12px; margin: 0; padding: 0; border: 0; }
    .pebble-row { display: flex; flex-direction: row-reverse; gap: 7px; }
    .pebble-row input { position: absolute; opacity: 0; pointer-events: none; }
    .pebble-row label { display: block; width: 28px; height: 24px; border-radius: var(--shape); background: var(--rail); cursor: pointer; transition: background .25s, translate .3s var(--spring); }
    .pebble-row label:nth-of-type(1) { --shape: 52% 48% 46% 54% / 60% 55% 45% 40%; }
    .pebble-row label:nth-of-type(2) { --shape: 45% 55% 58% 42% / 50% 62% 38% 50%; }
    .pebble-row label:nth-of-type(3) { --shape: 58% 42% 50% 50% / 46% 52% 48% 54%; }
    .pebble-row label:nth-of-type(4) { --shape: 48% 52% 42% 58% / 58% 44% 56% 42%; }
    .pebble-row label:nth-of-type(5) { --shape: 55% 45% 52% 48% / 42% 58% 42% 58%; }
    .pebble-row input:checked ~ label { background: var(--accent); }
    .pebble-row:hover input ~ label { background: var(--rail); }
    .pebble-row label:hover, .pebble-row label:hover ~ label { background: color-mix(in srgb, var(--accent) 60%, transparent) !important; translate: 0 -2px; }
    .pebble-row input:focus-visible + label { outline: 2px solid var(--accent); outline-offset: 3px; }
    .pebble-word { min-height: 20px; margin: 0; font-size: 13px; color: var(--muted); font-variant-numeric: tabular-nums; }

    /* 档位滑块 */
    .notch { position: relative; width: 210px; padding-top: 26px; }
    .notch-labels { position: absolute; inset: 0 0 auto; display: flex; justify-content: space-between; font-size: 12px; color: var(--muted); }
    .notch-labels span { width: 34px; text-align: center; transition: color .25s, translate .35s var(--spring), font-weight .25s; }
    .notch-labels span[data-on] { color: var(--accent); font-weight: 650; translate: 0 -3px; }
    .notch-track { position: relative; height: 34px; border-radius: 17px; background: var(--rail); }
    .notch-track i { position: absolute; top: 50%; width: 4px; height: 4px; margin: -2px; border-radius: 50%; background: var(--muted); opacity: .5; left: calc(20px + var(--n) * (100% - 40px) / 4); }
    .notch-thumb { position: absolute; top: 3px; height: 28px; width: 34px; border-radius: 14px; left: calc(var(--v) * (100% - 40px) / 4 + 3px); background: var(--raised); box-shadow: var(--shadow); transition: left .45s var(--spring), width .3s var(--spring), margin .3s var(--spring); }
    .notch[data-drag] .notch-thumb { width: 44px; margin-left: -5px; }
    .notch-fill { position: absolute; inset: 0 auto 0 0; width: calc(var(--v) * (100% - 40px) / 4 + 37px); border-radius: 17px; background: var(--accent-soft); transition: width .45s var(--spring); }
    .notch input { position: absolute; inset: 26px 0 0; width: 100%; height: 34px; margin: 0; opacity: 0; cursor: pointer; }
    .notch input:focus-visible ~ .notch-track { outline: 2px solid var(--accent); outline-offset: 3px; }

    /* 密码强度 */
    .secret { display: grid; gap: 10px; width: 220px; }
    .secret-field { display: flex; align-items: center; height: 44px; padding: 0 6px 0 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--raised); transition: border-color .25s, box-shadow .25s; }
    .secret-field:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .secret-field input { flex: 1; min-width: 0; height: 100%; padding: 0; border: 0; outline: 0; background: none; font-size: 15px; letter-spacing: .04em; }
    .secret-eye { display: grid; place-items: center; width: 34px; height: 34px; padding: 0; border: 0; border-radius: 9px; background: none; color: var(--muted); }
    .secret-eye:hover { color: var(--ink); background: var(--surface); }
    .secret-eye svg { width: 20px; height: 20px; fill: none; stroke: currentColor; stroke-width: 1.6; stroke-linecap: round; }
    .secret-eye .slash { stroke-dasharray: 22; stroke-dashoffset: 0; transition: stroke-dashoffset .3s var(--ease); }
    .secret-eye[aria-pressed="true"] .slash { stroke-dashoffset: 22; }
    .secret-eye .lid { transform-origin: center; transition: scale .25s var(--ease); }
    .secret-meter { display: grid; grid-template-columns: repeat(4, 1fr); gap: 5px; }
    .secret-meter i { height: 5px; border-radius: 3px; background: var(--rail); overflow: hidden; }
    .secret-meter i::after { display: block; height: 100%; content: ''; background: var(--tone, var(--accent)); transform: scaleX(0); transform-origin: left; transition: transform .35s var(--ease) calc(var(--n) * 50ms), background .3s; }
    .secret-meter i[data-on]::after { transform: scaleX(1); }
    .secret-note { display: flex; justify-content: space-between; margin: 0; font-size: 12px; color: var(--muted); }
    .secret-note strong { color: var(--tone, var(--muted)); font-weight: 650; transition: color .3s; }

    /* 标签输入 */
    .chips { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; width: 236px; min-height: 46px; padding: 7px; border: 1px solid var(--line); border-radius: 13px; background: var(--raised); cursor: text; transition: border-color .25s, box-shadow .25s; }
    .chips:focus-within { border-color: var(--accent); box-shadow: 0 0 0 4px var(--accent-soft); }
    .chip { display: inline-flex; align-items: center; gap: 3px; height: 28px; padding: 0 4px 0 10px; border-radius: 8px; background: var(--accent-soft); color: var(--accent); font-size: 13px; font-weight: 560; white-space: nowrap; animation: chip-in .38s var(--spring); }
    .chip button { display: grid; place-items: center; width: 20px; height: 20px; padding: 0; border: 0; border-radius: 6px; background: none; color: inherit; font-size: 15px; line-height: 1; opacity: .7; }
    .chip button:hover { opacity: 1; background: color-mix(in srgb, var(--accent) 16%, transparent); }
    .chips input { flex: 1; min-width: 64px; height: 28px; padding: 0 4px; border: 0; outline: 0; background: none; font-size: 14px; }
    .chips input::placeholder { color: var(--muted); }
    @keyframes chip-in { from { scale: .6; opacity: 0; } }

    /* 方案卡片 */
    .plans { position: relative; display: grid; grid-template-columns: repeat(3, 74px); gap: 8px; margin: 0; padding: 0; border: 0; }
    .plans label { position: relative; display: grid; align-content: center; gap: 2px; height: 86px; padding: 0 10px; border: 1px solid var(--line); border-radius: 14px; background: var(--raised); cursor: pointer; transition: translate .3s var(--spring); }
    .plans label:hover { translate: 0 -2px; }
    .plans input { position: absolute; opacity: 0; pointer-events: none; }
    .plans b { font-size: 13px; font-weight: 650; }
    .plans small { font-size: 12px; color: var(--muted); font-variant-numeric: tabular-nums; }
    .plans input:checked ~ small { color: var(--accent); }
    .plans input:focus-visible ~ b { text-decoration: underline; text-underline-offset: 3px; }
    .plan-ring { position: absolute; top: 0; left: 0; width: 74px; height: 86px; border: 2px solid var(--accent); border-radius: 14px; pointer-events: none; translate: var(--x, 0) 0; transition: translate .5s var(--spring); }
    .plan-ring::after { position: absolute; top: -8px; right: -8px; display: grid; place-items: center; width: 20px; height: 20px; content: '✓'; border-radius: 50%; background: var(--accent); color: var(--on-accent); font-size: 12px; font-weight: 700; }
    .plan-ring[data-move] { animation: ring-squash .5s var(--ease); }
    @keyframes ring-squash { 40% { scale: 1.08 .94; } }

    [data-single] .samples { grid-template-columns: 1fr; }
    [data-single] .sample { width: min(100%, 420px); }
    [data-embedded] body, [data-embedded] html { background: var(--surface); }
    [data-embedded] .page, [data-embedded] .sample { width: 100%; max-width: none; padding: 0; }
    [data-embedded] .intro, [data-embedded] .masthead, [data-embedded] .credit, [data-embedded] .caption, [data-embedded] .tide-hint { display: none; }
    [data-embedded] .stage { height: 100dvh; border-radius: 0; }

    @media (max-width: 820px) { .samples { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
    @media (max-width: 520px) {
      .page { padding: 0 18px; }
      .samples { grid-template-columns: 1fr; }
      .stage { height: 190px; }
    }
    @media (prefers-reduced-motion: reduce) {
      *, *::before, *::after { transition-duration: 0s !important; transition-delay: 0s !important; }
    }
    [data-gallery-active="false"] * { transition-duration: 0s !important; transition-delay: 0s !important; }
  </style>
</head>
<body>
  <div class="page">
    <header class="masthead">
      <a class="brand" href="../../">UI Moments</a>
      <nav>
        <a class="site-link" id="gallery-link" href="../../">图鉴 ↗</a>
        <a class="site-link" id="all-controls" href="./inputs.html" hidden>本页全部控件 ↗</a>
        <button class="theme" id="theme" type="button" aria-label="切换深浅色"><svg viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.5" aria-hidden="true"><circle cx="10" cy="10" r="7"/><path d="M10 3a7 7 0 0 0 0 14Z" fill="currentColor"/></svg></button>
      </nav>
    </header>
    <main>
      <header class="intro">
        <p>UI Moments Originals</p>
        <h1>原创表单控件</h1>
        <p>六个从零设计的表单控件。全部基于原生表单元素，键盘、读屏与「减少动态效果」都能正常工作。</p>
      </header>


      <div class="samples">

        <section class="sample" id="stroke-checklist" aria-labelledby="todo-title">
          <div class="stage"><div class="widget">
            <fieldset class="todo"><legend class="sr-only">今日待办</legend>
              <label><input type="checkbox"><span class="box"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="text">整理需求</span></label>
              <label><input type="checkbox" checked><span class="box"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="text">画线框图</span></label>
              <label><input type="checkbox"><span class="box"><svg viewBox="0 0 16 16" aria-hidden="true"><path d="M3.5 8.5l3 3 6-7"/></svg></span><span class="text">写交接文档</span></label>
            </fieldset>
          </div></div>
          <div class="caption"><h2 id="todo-title">划线清单</h2><p>勾选完成</p></div>
        </section>

        <section class="sample" id="pebble-rating" aria-labelledby="pebble-title">
          <div class="stage"><div class="widget">
            <fieldset class="pebbles"><legend class="sr-only">评分</legend>
              <div class="pebble-row">
                <input type="radio" name="pebble" id="pebble-5" value="5"><label for="pebble-5" title="超棒"><span class="sr-only">5 分</span></label>
                <input type="radio" name="pebble" id="pebble-4" value="4" checked><label for="pebble-4" title="很好"><span class="sr-only">4 分</span></label>
                <input type="radio" name="pebble" id="pebble-3" value="3"><label for="pebble-3" title="还行"><span class="sr-only">3 分</span></label>
                <input type="radio" name="pebble" id="pebble-2" value="2"><label for="pebble-2" title="一般"><span class="sr-only">2 分</span></label>
                <input type="radio" name="pebble" id="pebble-1" value="1"><label for="pebble-1" title="很差"><span class="sr-only">1 分</span></label>
              </div>
              <p class="pebble-word" aria-live="polite">4 / 5 · 很好</p>
            </fieldset>
          </div></div>
          <div class="caption"><h2 id="pebble-title">石子评分</h2><p>点按打分</p></div>
        </section>

        <section class="sample" id="notch-slider" aria-labelledby="notch-title">
          <div class="stage"><div class="widget">
            <div class="notch" style="--v:2">
              <div class="notch-labels" aria-hidden="true"><span>XS</span><span>S</span><span data-on>M</span><span>L</span><span>XL</span></div>
              <input type="range" min="0" max="4" step="1" value="2" aria-labelledby="notch-title" aria-valuetext="M">
              <div class="notch-track" aria-hidden="true"><span class="notch-fill"></span><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i><i style="--n:4"></i><span class="notch-thumb"></span></div>
            </div>
          </div></div>
          <div class="caption"><h2 id="notch-title">档位滑块</h2><p>拖动选尺码</p></div>
        </section>

        <section class="sample" id="strength-meter" aria-labelledby="secret-title">
          <div class="stage"><div class="widget">
            <div class="secret">
              <div class="secret-field">
                <input type="password" value="moments" aria-labelledby="secret-title" aria-describedby="secret-note" autocomplete="new-password" spellcheck="false">
                <button class="secret-eye" type="button" aria-label="显示密码" aria-pressed="false"><svg viewBox="0 0 20 20" aria-hidden="true"><path class="lid" d="M2 10s3-5.5 8-5.5S18 10 18 10s-3 5.5-8 5.5S2 10 2 10Z"/><circle class="lid" cx="10" cy="10" r="2.4"/><path class="slash" d="M3.5 3.5l13 13"/></svg></button>
              </div>
              <div class="secret-meter" aria-hidden="true"><i style="--n:0"></i><i style="--n:1"></i><i style="--n:2"></i><i style="--n:3"></i></div>
              <p class="secret-note" id="secret-note" aria-live="polite"><span>强度</span><strong>一般</strong></p>
            </div>
          </div></div>
          <div class="caption"><h2 id="secret-title">密码强度</h2><p>输入试试</p></div>
        </section>

        <section class="sample" id="chip-input" aria-labelledby="chip-title">
          <div class="stage"><div class="widget">
            <div class="chips" role="group" aria-labelledby="chip-title">
              <input type="text" placeholder="回车添加" aria-label="新标签" enterkeyhint="done" maxlength="8">
            </div>
          </div></div>
          <div class="caption"><h2 id="chip-title">标签输入</h2><p>回车添加</p></div>
        </section>

        <section class="sample" id="plan-picker" aria-labelledby="plan-title">
          <div class="stage"><div class="widget">
            <fieldset class="plans"><legend class="sr-only">选择方案</legend>
              <span class="plan-ring" aria-hidden="true"></span>
              <label><input type="radio" name="plan" value="basic"><b>基础</b><small>免费</small></label>
              <label><input type="radio" name="plan" value="pro" checked><b>专业</b><small>¥28/月</small></label>
              <label><input type="radio" name="plan" value="team"><b>团队</b><small>¥98/月</small></label>
            </fieldset>
          </div></div>
          <div class="caption"><h2 id="plan-title">方案卡片</h2><p>点选方案</p></div>
        </section>
      </div>
    </main>
    <footer class="credit">六个表单控件均由 UI Moments 原创设计与实现，按项目 <a href="../../LICENSE">MIT 许可证</a> 发布。<a href="./index.html">更多原创控件 ↗</a></footer>
  </div>

  <script>
    const root = document.documentElement;
    const params = new URLSearchParams(location.search);
    const reducedMotion = matchMedia('(prefers-reduced-motion: reduce)');
    const motionEnabled = () => !reducedMotion.matches && root.dataset.galleryActive !== 'false';
    const $ = (selector, scope = document) => scope.querySelector(selector);
    const $$ = (selector, scope = document) => Array.from(scope.querySelectorAll(selector));
    const clamp = (value, min, max) => Math.min(max, Math.max(min, value));

    // 单个控件：独立页面用 #id，画廊嵌入用 ?sample=id。
    const sections = $$('.sample');
    function showSelectedSample() {
      const id = location.hash.slice(1) || (root.dataset.embedded && params.get('sample'));
      const selected = sections.find(section => section.id === id) || (root.dataset.embedded && sections[0]);
      root.toggleAttribute('data-single', Boolean(selected));
      for (const section of sections) section.hidden = Boolean(selected && section !== selected);
      $('#gallery-link').hidden = Boolean(selected);
      $('#all-controls').hidden = !selected;
    }
    showSelectedSample();
    addEventListener('hashchange', showSelectedSample);

    $('#theme').addEventListener('click', () => {
      root.dataset.theme = root.dataset.theme === 'light' ? 'dark' : 'light';
      try { localStorage.setItem('ui-moments-theme', root.dataset.theme); } catch {}
    });

    /* ---------- 石子评分：选中后石子从左到右依次弹起 ---------- */
    {
      const words = ['', '很差', '一般', '还行', '很好', '超棒'];
      const group = $('.pebbles');
      const word = $('.pebble-word', group);
      group.addEventListener('change', event => {
        const value = Number(event.target.value);
        word.textContent = `${value} / 5 · ${words[value]}`;
        if (!motionEnabled()) return;
        for (let index = 1; index <= value; index++) {
          $(`label[for="pebble-${index}"]`, group).animate(
            [{ transform: 'translateY(0) scale(1)' }, { transform: 'translateY(-7px) scale(1.12, .9)' }, { transform: 'none' }],
            { duration: 380, delay: (index - 1) * 45, easing: 'cubic-bezier(.3,.7,.4,1.4)' },
          );
        }
      });
    }

    /* ---------- 档位滑块：拖动时拨块变宽，档位标签跟着抬起 ---------- */
    {
      const notch = $('.notch');
      const range = $('input', notch);
      const labels = $$('.notch-labels span', notch);
      const sizes = ['XS', 'S', 'M', 'L', 'XL'];
      range.addEventListener('input', () => {
        notch.style.setProperty('--v', range.value);
        labels.forEach((label, index) => label.toggleAttribute('data-on', index === range.valueAsNumber));
        range.setAttribute('aria-valuetext', sizes[range.value]);
      });
      range.addEventListener('pointerdown', () => { notch.dataset.drag = ''; });
      for (const type of ['pointerup', 'pointercancel', 'blur']) range.addEventListener(type, () => delete notch.dataset.drag);
    }

    /* ---------- 密码强度：分段依次填满，颜色随强度变化 ---------- */
    {
      const box = $('.secret');
      const input = $('input', box);
      const eye = $('.secret-eye', box);
      const segments = $$('.secret-meter i', box);
      const note = $('strong', box);
      const levels = [['太短', '--weak'], ['弱', '--weak'], ['一般', '--warn'], ['良好', '--accent'], ['很强', '--ok']];
      function score(text) {
        if (text.length < 4) return 0;
        let points = text.length >= 8 ? 2 : 1;
        points += [/[a-z]/, /[A-Z]/, /\d/, /[^\w]/].filter(pattern => pattern.test(text)).length - 1;
        return clamp(points, 1, 4);
      }
      function paint() {
        const level = score(input.value);
        const [label, tone] = levels[level];
        box.style.setProperty('--tone', `var(${tone})`);
        segments.forEach((segment, index) => segment.toggleAttribute('data-on', index < level));
        note.textContent = label;
      }
      input.addEventListener('input', paint);
      eye.addEventListener('click', () => {
        const show = input.type === 'password';
        input.type = show ? 'text' : 'password';
        eye.setAttribute('aria-pressed', String(show));
        eye.setAttribute('aria-label', show ? '隐藏密码' : '显示密码');
        if (motionEnabled()) $$('.lid', eye).forEach(lid => lid.animate([{ scale: '1 1' }, { scale: '1 .1' }, { scale: '1 1' }], { duration: 260, easing: 'ease-in-out' }));
      });
      paint();
    }

    /* ---------- 标签输入：回车弹出新标签，退格把最后一个收回 ---------- */
    {
      const field = $('.chips');
      const input = $('input', field);
      const max = 5;
      function add(text) {
        text = text.trim();
        const existing = $$('.chip', field).map(chip => chip.dataset.value);
        if (!text || existing.includes(text)) {
          if (motionEnabled()) field.animate([{ translate: '0 0' }, { translate: '-4px 0' }, { translate: '4px 0' }, { translate: '0 0' }], { duration: 240 });
          return;
        }
        if (existing.length >= max) remove($('.chip', field));
        const chip = document.createElement('span');
        chip.className = 'chip';
        chip.dataset.value = text;
        chip.append(text);
        const close = document.createElement('button');
        close.type = 'button';
        close.textContent = '×';
        close.setAttribute('aria-label', `移除 ${text}`);
        close.addEventListener('click', () => { remove(chip); input.focus(); });
        chip.append(close);
        field.insertBefore(chip, input);
      }
      function remove(chip) {
        if (!chip || chip.dataset.leaving) return;
        chip.dataset.leaving = '';
        if (!motionEnabled()) return chip.remove();
        chip.animate([{ scale: 1, opacity: 1 }, { scale: .5, opacity: 0 }], { duration: 180, easing: 'ease-in' }).onfinish = () => chip.remove();
      }
      input.addEventListener('keydown', event => {
        if (event.isComposing) return;
        if (event.key === 'Enter' || event.key === ',' || event.key === '，') {
          event.preventDefault();
          add(input.value);
          input.value = '';
        } else if (event.key === 'Backspace' && !input.value) {
          remove($$('.chip:not([data-leaving])', field).at(-1));
        }
      });
      field.addEventListener('pointerdown', event => { if (event.target === field) { event.preventDefault(); input.focus(); } });
      ['设计', '动效'].forEach(add);
    }

    /* ---------- 方案卡片：选中描边从旧卡片滑到新卡片 ---------- */
    {
      const plans = $('.plans');
      const ring = $('.plan-ring', plans);
      const labels = $$('label', plans);
      function place(animate) {
        const index = labels.findIndex(label => $('input', label).checked);
        ring.style.setProperty('--x', labels[index].offsetLeft + 'px');
        if (!animate || !motionEnabled()) return;
        ring.removeAttribute('data-move');
        void ring.offsetWidth;
        ring.dataset.move = '';
      }
      plans.addEventListener('change', () => place(true));
      ring.style.transition = 'none';
      place(false);
      requestAnimationFrame(() => requestAnimationFrame(() => { ring.style.transition = ''; }));
    }
  </script>
</body>
</html>
